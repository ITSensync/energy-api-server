name: Deploy Express Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 1404
          script: |
            cd /var/www/api-energy.getsensync.com

            echo "Pull latest code"
            git pull origin main

            echo "Stop old container"
            docker stop api-energy || true
            docker rm api-energy || true

            echo "Build new image"
            docker build -t api-energy .

            echo "Run container"
            docker run -d \
              --name api-energy \
              -p 3008:3008 \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              -e TZ=Asia/Jakarta \
              api-energy

            echo "Deploy done"
